services:
  postgres:
    image: postgres:14.5
    container_name: postgres-container
    restart: always
    env_file: ./warehouse/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_NAME=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - '5433:5432'    
  
  redis:
    image: redis:latest
    container_name: redis-container
    restart: always
    env_file: ./warehouse/.env
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"

  web:
    build: .
    container_name: web-container
    restart: always
    volumes:
      - .:/code
    env_file: ./warehouse/.env
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000
    environment:
      - DJANGO_SETTINGS_MODULE=warehouse.settings
      - POSTGRES_NAME=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    depends_on:
      - postgres
      - redis

  celery:
    build: .
    container_name: celery-container
    volumes:
      - .:/code
    env_file: ./warehouse/.env
    depends_on:
      - postgres
      - redis
      - web
    command: ['celery', '-A', 'warehouse', 'worker', '--pool=solo', '--loglevel=info']

  
volumes:
  postgres_data:
  redis_data: 