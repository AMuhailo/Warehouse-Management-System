{% extends "base.html" %}

{% block title %} Asign Worker {% endblock title %}

{% block content %}
<div class="content-detail container w-25">
    <div class="align-items-center p-3">
        <div class="my-3">
            <a href="{% url 'emp:worker_list_url'%}" class="text-decoration-none"><i class="bi bi-arrow-bar-left"></i></a>
            <h5 class="text-uppercase">Asign Worker</h5>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <input type='submit' class='btn btn-sm btn-success' value='Add worker'>
            </form>
        </div>
    </div>
</div>
{% endblock content %}
