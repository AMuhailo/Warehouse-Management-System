<form action="{% url 'manage:category_create_url'%}" method="POST" class="ms-auto">
    <div class="input-group mb-3">
        {% csrf_token %}
        {% comment %} <input type="text" class="form-control" placeholder="Recipient's username" aria-label="Recipient's username" aria-describedby="button-addon2"> {% endcomment %}
        {{ form.as_p}}
        <button class="btn btn-outline-secondary" type="submit" id="button-addon2">Add</button>
    </div>
</form>
