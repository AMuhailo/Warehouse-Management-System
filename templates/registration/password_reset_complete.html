{% extends "base.html" %}
{% load static%}

{% block title %}Reset Password{% endblock title %}

{% block content %}
<!-- Card Home -->
<div class="card home-card border-0 mt-5 text-center">
    <h2>Reset password</h2>
    <p>Your password has been set.</p>
    <form action="{% url 'login' %}" method="post" class="mt-1 mx-auto">
        {% csrf_token %}
        <button class="rounded px-4 py-1 btn-login text-white">
            Login
        </button>
    </form>
</div> 
{% endblock content %}
